      for (var i = 0; i < editSnapshots.length; i++) {
        if (editSnapshots[i].el === el) return;
      }
      var nodes = editTextNodesOf(el);
      var runs = [];
      for (var j = 0; j < nodes.length; j++) {
        runs.push(String(nodes[j].nodeValue == null ? '' : nodes[j].nodeValue));
      }
      // Read the already-stamped editId. Activation stamps every editable
      // element with data-ls-edit-id before any focus can happen, so this
      // attribute is always present at snapshot time.
      var editId = parseInt(String(el.getAttribute('data-ls-edit-id') || ''), 10);
      if (!Number.isFinite(editId) || editId < 0) editId = -1;
      editSnapshots.push({ el: el, oldHTML: el.innerHTML, runs: runs, editId: editId });
    }

    // Look up an editable element by its editId. Prefers a snapshot match (the
    // element was previously focused, so we have a baseline to diff against);
    // falls back to the live DOM for elements that were stamped at activation
    // but never received focus. Returns { snap, el } or null.
    function editTextSnapshotByEditId(editId) {
      for (var i = 0; i < editSnapshots.length; i++) {
        if (editSnapshots[i].editId === editId) {
          return { snap: editSnapshots[i], el: editSnapshots[i].el };
        }
      }
      var sel = '[data-ls-edit-id="' + String(editId) + '"]';
      var el = null;
      try { el = document.querySelector(sel); } catch (e) {}
      if (el) return { snap: null, el: el };
      return null;
    }

    // Per-element dirty check. Returns true on text-node mismatch OR structural
    // divergence (node count changed). When the snapshot is missing (element
    // never focused), the element is by definition not dirty.
    function editTextIsDirtyByEditId(editId) {
      var hit = editTextSnapshotByEditId(editId);
      if (!hit || !hit.snap) return false;
      var snap = hit.snap;
      var cur = editTextNodesOf(snap.el);
      if (cur.length !== snap.runs.length) return true;
      for (var i = 0; i < cur.length; i++) {
        var nv = String(cur[i].nodeValue == null ? '' : cur[i].nodeValue);
        if (nv !== snap.runs[i]) return true;
      }
      return false;
    }

    // First ~120 chars of an element's current concatenated text-node values.
    // Used for the parent's discard-confirmation modal title.
    function editTextDirtyPreview(el) {
      var nodes = editTextNodesOf(el);
      var buf = '';
      for (var i = 0; i < nodes.length && buf.length < EDIT_TEXT_DIRTY_PREVIEW_MAX; i++) {
        buf += String(nodes[i].nodeValue == null ? '' : nodes[i].nodeValue);
      }
      buf = buf.replace(/s+/g, ' ').trim();
      if (buf.length > EDIT_TEXT_DIRTY_PREVIEW_MAX) {
        buf = buf.slice(0, EDIT_TEXT_DIRTY_PREVIEW_MAX);
      }
      return buf;
    }

    // Build the active-edit-element payload for a given editId.
    function editTextActiveElementPayload(editId) {
      var hit = editTextSnapshotByEditId(editId);
      if (!hit) return null;
      var el = hit.el;
      var rect;
      try {
        var r = el.getBoundingClientRect();
        rect = { top: r.top, left: r.left, width: r.width, height: r.height };
      } catch (e) {
        rect = { top: 0, left: 0, width: 0, height: 0 };
      }
      // Resolve sourceLoc from the nearest text node's stamped ancestor (or
      // the element's own stamp). Empty when the element has no source-loc;
      // the parent uses hasSourceLoc to label the floating Save button as
      // "Apply with AI" instead.
      var firstNode = null;
      try {
        var nodes = editTextNodesOf(el);
        firstNode = nodes[0] || el.firstChild || el;
      } catch (e) { firstNode = el; }
      var info = editTextLocForNode(firstNode);
      return {
        editId: editId,
        rect: rect,
        sourceLoc: info.loc || '',
        hasSourceLoc: !!info.loc,
        isDirty: editTextIsDirtyByEditId(editId),
      };
    }

    function editTextPostActiveElement(editId) {
      var origin = pickerLearnedParentOrigin;
      if (!origin) return;
      var payload = editTextActiveElementPayload(editId);
      if (!payload) return;
      try {
        window.parent.postMessage(
          Object.assign({ type: 'active-edit-element' }, payload),
          origin
        );
      } catch (e) {}
    }

    function editTextPostFocusChangeRequest(fromEditId, toEditId) {
      var origin = pickerLearnedParentOrigin;
      if (!origin) return;
      var hit = editTextSnapshotByEditId(fromEditId);
      var preview = hit ? editTextDirtyPreview(hit.el) : '';
      try {
        window.parent.postMessage(
          {
            type: 'request-focus-change',
            fromEditId: fromEditId,
            toEditId: toEditId,
            dirtyPreview: preview,
          },
          origin
        );
      } catch (e) {}
    }

    // Diff every snapshotted element's current text nodes vs the snapshot.
    // Returns { exact: [...], agent: [...] }.
    function editTextComputeEdits() {
      var exact = [];
      var agent = [];
      var pathName = window.location.pathname;
      for (var s = 0; s < editSnapshots.length; s++) {
        var snap = editSnapshots[s];
        var cur = editTextNodesOf(snap.el);
        if (cur.length !== snap.runs.length) {
          // Child structure changed (edit crossed an inline boundary, node
          // split/merge). Can't map runs safely → hand the whole element to
          // the agent as a flattened old→new text change.
          var oldFlat = snap.runs.join('');
          var newFlat = '';
          for (var c = 0; c < cur.length; c++) {
            newFlat += String(cur[c].nodeValue == null ? '' : cur[c].nodeValue);
          }
          if (oldFlat !== newFlat && editTextByteLen(newFlat) <= EDIT_TEXT_MAX_BYTES) {
            var elInfo = editTextLocForNode(cur[0] || snap.el.firstChild || snap.el);
            try {
              console.warn('[ls-edit] -> agent (structural: text-node count ' +
                snap.runs.length + ' -> ' + cur.length + ') tag=' +
                String(snap.el.tagName || '').toLowerCase() + ' loc=' + (elInfo.loc || '(none)'));
            } catch (e) {}
            agent.push({
              sourceLoc: elInfo.loc,
              oldText: oldFlat,
              newText: newFlat,
              tag: String(snap.el.tagName || '').toLowerCase().slice(0, 64),
              path: pathName,
              structural: true,
            });
          }
          continue;
        }
        for (var i = 0; i < cur.length; i++) {
          var nv = String(cur[i].nodeValue == null ? '' : cur[i].nodeValue);
          if (nv === snap.runs[i]) continue;
          if (editTextByteLen(nv) > EDIT_TEXT_MAX_BYTES) continue;
          if (editTextByteLen(snap.runs[i]) > EDIT_TEXT_MAX_BYTES) continue;
          var info = editTextLocForNode(cur[i]);
          var entry = {
            sourceLoc: info.loc,
            oldText: snap.runs[i],
            newText: nv,
            tag: info.tag,
            path: pathName,
          };
          // A run with a source loc is exact-replaceable; without one, only the
          // agent can place it.
          if (!info.loc) {
            try {
              console.warn('[ls-edit] -> agent (no data-source-loc on nearest ' +
                'ancestor) tag=' + info.tag + ' text=' + JSON.stringify(nv.slice(0, 60)));
            } catch (e) {}
          }
          (info.loc ? exact : agent).push(entry);
        }
      }
      return { exact: exact, agent: agent };
    }

    function editTextPostCount() {
      var origin = pickerLearnedParentOrigin;
      if (!origin) return;
      var r = editTextComputeEdits();
      try {
        window.parent.postMessage(
          { type: 'edit-queue-count', count: r.exact.length + r.agent.length, persistable: r.exact.length },
          origin
        );
      } catch (e) {}
    }

    function editTextOnFocusIn(e) {
      var el = e.target;
      if (!el || !el.matches || !el.matches(EDIT_TEXT_EDITABLE)) return;
      // Batch edit mode: focus moves freely between editable elements. Every
      // focused element is snapshotted on first focus, so its edits accumulate
      // in the queue and persist together on the parent's Save (flush-edits).
      // No single-dirty-element guard — the user can touch any number of
      // elements before saving.
      var targetEditIdAttr = el.getAttribute && el.getAttribute('data-ls-edit-id');
      var targetEditId = targetEditIdAttr == null
        ? null
        : parseInt(String(targetEditIdAttr), 10);
      editingEl = el;
      editTextSnapshotFor(el);   // capture the true original on first focus
      if (Number.isFinite(targetEditId)) {
        editActiveEditId = targetEditId;
        editTextPostActiveElement(targetEditId);
      }
    }

    function editTextOnFocusOut(e) {
      if (e.target !== editingEl) return;
      editingEl = null;
      editTextPostCount();
    }

    function editTextOnInput(e) {
      var el = e.target;
      if (!el || !el.matches || !el.matches(EDIT_TEXT_EDITABLE)) return;
      var editIdAttr = el.getAttribute && el.getAttribute('data-ls-edit-id');
      var editId = editIdAttr == null ? null : parseInt(String(editIdAttr), 10);
      if (!Number.isFinite(editId)) return;
      if (editActiveEditId !== editId) editActiveEditId = editId;
      // Re-post the whole-queue count on every keystroke so the (new) parent's
      // batch Save bar reflects the current change count live (the diff only
      // walks the handful of snapshotted/focused elements, so this is cheap).
      editTextPostCount();
      // Backward-compat for cached OLD app bundles: their per-element floating
      // Save pill only appears while the focused element is dirty, and it
      // learned that from the active-edit-element message posted on input. The
      // new app ignores this message, so emitting it costs nothing there but
      // keeps un-refreshed clients able to save during the deploy-skew window.
      editTextPostActiveElement(editId);
    }

    function editTextOnScroll() {
      if (editActiveEditId === null) return;
      editTextPostActiveElement(editActiveEditId);
    }

    function editTextOnResize() {
      if (editActiveEditId === null) return;
      editTextPostActiveElement(editActiveEditId);
    }

    function editTextOnMouseDownCapture() {
      // Batch edit mode: focus moves freely between elements, so there is no
      // single-dirty-element guard to enforce on pointer-driven focus moves.
      // Retained as a no-op so the listener add/remove wiring in
      // editTextActivate / editTextTeardown stays symmetric.
    }

    function editTextOnKeyDown(e) {
      if (e.target !== editingEl) return;
      // Enter and Escape both just blur the field (which queues the change).
      // Neither exits edit mode — that's the Save / Cancel buttons. Enter's
      // preventDefault stops a <br>/<div> from being inserted into source.
      if (e.key === 'Enter' || e.keyCode === 13 || e.key === 'Escape' || e.keyCode === 27) {
        e.preventDefault();
        try { editingEl.blur(); } catch (err) {}
      }
    }

    function editTextOnPaste(e) {
      if (e.target !== editingEl) return;
      // Strip formatting: rich HTML pasted into a plain-text v1 span would
      // inject markup the source replace cannot model. Insert as plain text and
      // collapse newlines (v1 spans are single-line).
      e.preventDefault();
      var text = '';
      try { text = (e.clipboardData || window.clipboardData).getData('text/plain') || ''; } catch (err) { text = ''; }
      text = text.replace(/[\r\n]+/g, ' ');
      try { document.execCommand('insertText', false, text); }
      catch (err) {
        editingEl.textContent = String(editingEl.textContent || '') + text;
        editTextCaretToEnd(editingEl);
      }
    }

    function editTextOnClickCapture(e) {
      // In edit mode, suppress navigation/activation on editable anchors so a
      // click places the caret instead of navigating. mousedown still runs, so
      // caret placement and focus are unaffected.
      var el = e.target;
      if (el && el.matches && el.matches(EDIT_TEXT_EDITABLE)) e.preventDefault();
    }

    function editTextActivate(originForCommits) {
      if (originForCommits) pickerLearnedParentOrigin = originForCommits;
      if (editTextActive) return;
      // Edit and pick modes are mutually exclusive; defensively tear down pick.
      if (pickActive) pickerDeactivate();
      editTextActive = true;
      editSnapshots = [];
      editIdCounter = 0;
      editDirtyEditId = null;
      editActiveEditId = null;
      editFocusGuardSuspended = false;
      var els = document.querySelectorAll(EDIT_TEXT_EDITABLE);
      for (var i = 0; i < els.length; i++) {
        try {
          els[i].setAttribute('contenteditable', 'true');
          els[i].setAttribute('data-ls-editable', '1');
          // Stamp a per-activation editId on every editable host BEFORE any
          // focus can happen. The parent addresses elements by this id in the
          // per-element flush / discard / refresh-snapshot / focus-change
          // messages; without the stamp, unfocused elements would have no id.
          els[i].setAttribute('data-ls-edit-id', String(editIdCounter++));
          els[i].spellcheck = false;
        } catch (e) {}
      }
      document.addEventListener('focusin', editTextOnFocusIn, true);
      document.addEventListener('focusout', editTextOnFocusOut, true);
      document.addEventListener('keydown', editTextOnKeyDown, true);
      document.addEventListener('paste', editTextOnPaste, true);
      document.addEventListener('click', editTextOnClickCapture, true);
      document.addEventListener('mousedown', editTextOnMouseDownCapture, true);
      document.addEventListener('input', editTextOnInput, true);
      window.addEventListener('scroll', editTextOnScroll, true);
      window.addEventListener('resize', editTextOnResize);
      try { document.documentElement.setAttribute('data-ls-edit-mode', '1'); } catch (e) {}
    }

    function editTextTeardown() {
      // Tear down edit mode WITHOUT reverting (used after a successful save and
      // as the plain exit). Discard reverts separately before calling this.
      if (!editTextActive) return;
      editTextActive = false;
      editingEl = null;
      editSnapshots = [];
      editDirtyEditId = null;
      editActiveEditId = null;
      editFocusGuardSuspended = false;
      editIdCounter = 0;
      document.removeEventListener('focusin', editTextOnFocusIn, true);
      document.removeEventListener('focusout', editTextOnFocusOut, true);
      document.removeEventListener('keydown', editTextOnKeyDown, true);
      document.removeEventListener('paste', editTextOnPaste, true);
      document.removeEventListener('click', editTextOnClickCapture, true);
      document.removeEventListener('mousedown', editTextOnMouseDownCapture, true);
      document.removeEventListener('input', editTextOnInput, true);
      window.removeEventListener('scroll', editTextOnScroll, true);
      window.removeEventListener('resize', editTextOnResize);
      var cleared = document.querySelectorAll('[data-ls-editable]');
      for (var j = 0; j < cleared.length; j++) {
        try {
          cleared[j].removeAttribute('contenteditable');
          cleared[j].removeAttribute('data-ls-editable');
          cleared[j].removeAttribute('data-ls-edit-id');
        } catch (e) {}
      }
      try { document.documentElement.removeAttribute('data-ls-edit-mode'); } catch (e) {}
    }

    function editTextFlush() {
      // Save: blur the focused field so its latest text is in the DOM, then
      // diff all snapshots into run-level edits and post them. The "edits" are
      // exact-replaceable (have a source loc); "agentEdits" need the agent
      // (structural change, or no resolvable loc).
      if (editingEl) { try { editingEl.blur(); } catch (e) {} editingEl = null; }
      var r = editTextComputeEdits();
      var origin = pickerLearnedParentOrigin;
      if (!origin) return;
      try {
        window.parent.postMessage(
          { type: 'text-edit-batch', edits: r.exact, agentEdits: r.agent },
          origin
        );
      } catch (e) {}
    }

    function editTextDiscard() {
      // Cancel: revert every TOUCHED element. Restore each text node's value
      // IN PLACE (not innerHTML) so React's fiber tree keeps pointing at the
      // same DOM nodes — replacing nodes (innerHTML) detaches the originals and
      // makes a later React reconcile crash with "removeChild: not a child".
      // This also preserves styled inline children (we only touch text values).
      // If the child structure changed mid-edit (node added/removed/split) we
      // can't safely restore in place, so fall back to a full reload — the
      // source is unchanged, so the reload shows the original cleanly.
      if (editingEl) { try { editingEl.blur(); } catch (e) {} editingEl = null; }
      var needsReload = false;
      for (var i = 0; i < editSnapshots.length; i++) {
        var snap = editSnapshots[i];
        var cur = editTextNodesOf(snap.el);
        if (cur.length === snap.runs.length) {
          for (var j = 0; j < cur.length; j++) {
            try {
              if (cur[j].nodeValue !== snap.runs[j]) cur[j].nodeValue = snap.runs[j];
            } catch (e) {}
          }
        } else {
          needsReload = true;
        }
      }
      editTextTeardown();
      if (needsReload) { try { window.location.reload(); } catch (e) {} }
    }

    // Per-element variants of editTextComputeEdits / editTextDiscard /
    // baseline-refresh, scoped to one editId. Used by the parent's per-
    // element flush / discard / refresh-snapshot messages and the post-
    // focus-change accept handler.

    function editTextComputeEditsForElement(editId) {
      var hit = editTextSnapshotByEditId(editId);
      if (!hit || !hit.snap) return { exact: [], agent: [] };
      var snap = hit.snap;
      var pathName = window.location.pathname;
      var exact = [];
      var agent = [];
      var cur = editTextNodesOf(snap.el);
      if (cur.length !== snap.runs.length) {
        // Structural change for this element only — hand the whole thing
        // to the agent fallback (same shape as the whole-batch path).
        var oldFlat = snap.runs.join('');
        var newFlat = '';
        for (var c = 0; c < cur.length; c++) {
          newFlat += String(cur[c].nodeValue == null ? '' : cur[c].nodeValue);
        }
        if (oldFlat !== newFlat && editTextByteLen(newFlat) <= EDIT_TEXT_MAX_BYTES) {
          var elInfo = editTextLocForNode(cur[0] || snap.el.firstChild || snap.el);
          agent.push({
            sourceLoc: elInfo.loc,
            oldText: oldFlat,
            newText: newFlat,
            tag: String(snap.el.tagName || '').toLowerCase().slice(0, 64),
            path: pathName,
            structural: true,
          });
        }
        return { exact: exact, agent: agent };
      }
      for (var i = 0; i < cur.length; i++) {
        var nv = String(cur[i].nodeValue == null ? '' : cur[i].nodeValue);
        if (nv === snap.runs[i]) continue;
        if (editTextByteLen(nv) > EDIT_TEXT_MAX_BYTES) continue;
        if (editTextByteLen(snap.runs[i]) > EDIT_TEXT_MAX_BYTES) continue;
        var info = editTextLocForNode(cur[i]);
        var entry = {
          sourceLoc: info.loc,
          oldText: snap.runs[i],
          newText: nv,
          tag: info.tag,
          path: pathName,
        };
        (info.loc ? exact : agent).push(entry);
      }
      return { exact: exact, agent: agent };
    }

    function editTextFlushElement(editId) {
      var origin = pickerLearnedParentOrigin;
      if (!origin) return;
      // Blur the active editable so its latest text lands in the DOM before
      // we diff. Same posture as the whole-batch editTextFlush.
      if (editingEl) { try { editingEl.blur(); } catch (e) {} editingEl = null; }
      var r = editTextComputeEditsForElement(editId);
      try {
        window.parent.postMessage(
          {
            type: 'text-edit-batch',
            edits: r.exact,
            agentEdits: r.agent,
            forEditId: editId,
          },
          origin
        );
      } catch (e) {}
    }

    function editTextDiscardElement(editId) {
      var hit = editTextSnapshotByEditId(editId);
      if (!hit || !hit.snap) return false;
      var snap = hit.snap;
      var cur = editTextNodesOf(snap.el);
      if (cur.length !== snap.runs.length) {
        // Structural divergence — in-place revert isn't safe. Same fallback
        // as the whole-batch path: reload so the unchanged source repaints.
        try { window.location.reload(); } catch (e) {}
        return true;
      }
      for (var i = 0; i < cur.length; i++) {
        try {
          if (cur[i].nodeValue !== snap.runs[i]) cur[i].nodeValue = snap.runs[i];
        } catch (e) {}
      }
      // Clear dirty state and notify the parent so it dismisses the floating
      // control without waiting for a focus event.
      if (editDirtyEditId === editId) editDirtyEditId = null;
      editTextPostActiveElement(editId);
      return true;
    }

    function editTextRefreshSnapshot(editId) {
      var hit = editTextSnapshotByEditId(editId);
      if (!hit || !hit.snap) return;
      var snap = hit.snap;
      var cur = editTextNodesOf(snap.el);
      var newRuns = [];
      for (var i = 0; i < cur.length; i++) {
        newRuns.push(String(cur[i].nodeValue == null ? '' : cur[i].nodeValue));
      }
      snap.runs = newRuns;
      try { snap.oldHTML = snap.el.innerHTML; } catch (e) {}
      if (editDirtyEditId === editId) editDirtyEditId = null;
      editTextPostActiveElement(editId);
    }

    function editTextAcceptFocusChange(toEditId) {
      editFocusGuardSuspended = false;
      var hit = editTextSnapshotByEditId(toEditId);
      if (!hit) {
        // Target element vanished (e.g., page navigated) — drop active state.
        editActiveEditId = null;
        return;
      }
      try { hit.el.focus(); } catch (e) {}
      // The focusin handler will fire from .focus() and emit the fresh
      // active-edit-element. Fall back to a manual post in case focusin
      // doesn't fire (some browsers skip it when focus was already on a
      // child element).
      editActiveEditId = toEditId;
      editTextPostActiveElement(toEditId);
    }

    function editTextKeepFocus(fromEditId) {
      editFocusGuardSuspended = false;
      var hit = editTextSnapshotByEditId(fromEditId);
      if (!hit) return;
      try { hit.el.focus(); } catch (e) {}
      editActiveEditId = fromEditId;
      editTextPostActiveElement(fromEditId);
    }

    window.addEventListener('message', function(event) {
      var data = event && event.data;
      if (!data || typeof data !== 'object') return;
      var type = data.type;
      if (type !== 'selector-probe' && type !== 'enter-select' && type !== 'cancel-select'
          && type !== 'enter-edit-text' && type !== 'exit-edit-text'
          && type !== 'flush-edits' && type !== 'discard-edits'
          && type !== 'flush-element' && type !== 'discard-element'
          && type !== 'refresh-snapshot' && type !== 'accept-focus-change'
          && type !== 'keep-focus') {
        return;
      }
      // Strict origin validation for picker messages. Existing legacy
      // messages in this script use '*' / no origin check; picker is
      // intentionally locked down per R13.
      if (PICKER_ALLOWED_PARENT_ORIGINS.indexOf(event.origin) === -1) return;

      if (type === 'selector-probe') {
        // Parent-initiated readiness probe. Record the origin we're talking
        // to and reply directly to the source frame so we never broadcast.
        pickerLearnedParentOrigin = event.origin;
        if (event.source && event.source.postMessage) {
          try {
            event.source.postMessage({ type: 'selector-ready' }, event.origin);
          } catch (e) {}
          if (lsDocState) {
            try { event.source.postMessage(lsDocState, event.origin); } catch (e) {}
          }
          if (lsPerfState) {
            try { event.source.postMessage(lsPerfState, event.origin); } catch (e) {}
          }
        }
        return;
      }
      if (type === 'enter-select') {
        pickerLearnedParentOrigin = event.origin;
        // Ack BEFORE activation so the parent's 500ms ack timer measures
        // iframe responsiveness, not user click speed. Idempotent on
        // already-active: ack again so a duplicate enter-select still
        // satisfies the parent's timer.
        try {
          event.source.postMessage({ type: 'enter-select-ack' }, event.origin);
        } catch (e) {}
        if (pickActive) return;
        pickerActivate();
        return;
      }
      if (type === 'cancel-select') {
        // Idempotent: inactive cancel is a no-op (other than orphan cleanup).
        pickerDeactivate();
        return;
      }
      if (type === 'enter-edit-text') {
        // Ack BEFORE activation, same contract as enter-select-ack: the
        // parent's 500ms ack timer measures iframe responsiveness. Idempotent
        // on already-active so a duplicate enter-edit-text still satisfies
        // the parent's timer.
        try {
          event.source.postMessage({ type: 'enter-edit-text-ack' }, event.origin);
        } catch (e) {}
        // Record the origin so queue/batch messages post back to the right
        // parent even if the picker probe never ran.
        editTextActivate(event.origin);
        return;
      }
      if (type === 'exit-edit-text') {
        // Plain teardown (no revert) — used after a successful save.
        editTextTeardown();
        return;
      }
      if (type === 'flush-edits') {
        // Save: reply with the persistable batch (text-edit-batch).
        editTextFlush();
        return;
      }
      if (type === 'discard-edits') {
        // Cancel: revert all queued edits in place, then tear down.
        editTextDiscard();
        return;
      }
      if (type === 'flush-element') {

      // <vite-error-overlay> mounts, and the body has none of the Vite
      // transform-error signatures. React Router catches the throw and
      // renders its default ErrorBoundary:
      //   <main>
      //     <h1>Oops!</h1>
      //     <p>{error.message}</p>
      //     <pre><code>{error.stack}</code></pre>
      //   </main>

      // out of the first stack frame ("at X (/home/user/website/..:N:N)").
      function detectReactRouterErrorPage() {
        try {
          var h1 = document.querySelector('main h1');

          var codeEl = document.querySelector('main pre code');
          if (!codeEl) return null;

          // frames. Rejects false positives where a user's site happens to
          // have a similar DOM shape.

            path: capBytes(String(window.location.pathname || ''), VITE_ERROR_CAPS.path),

      // Router (and similar Vite SSR setups) returns a 500 HTTP response
      // whose body IS the error — "[vite] Internal Server Error",
      // "Transform failed", "[PARSE_ERROR]" — rendered as plain HTML, NOT
      // as a <vite-error-overlay> custom element. The HMR client never
      // mounts on this page, so the overlay observer alone misses it.

      // fixed the iframe sits on a stale error response. Re-fetch the
      // current URL on a bounded backoff; reload when the response body
      // no longer carries an error signature. We deliberately do NOT
      // start the poll for the <vite-error-overlay> case — Vite's own

        // source we inject into every HTML response — '[vite] Internal

        // inside detectViteSsrErrorPage, 'Oops!' as the detectReactRouterErrorPage
        // h1 comparison, and 'react-dom-server' in the documentation
        // comment above detectReactRouterErrorPage. Without stripping,
        // pageStillHasError would always return true regardless of whether
        // the underlying page actually has an error, so startErrorPoll
        // would never reload the iframe after the AI fixes the bug — the

        if (bodyOnly.indexOf('[PARSE_ERROR]') !== -1) return true;

        // Both strings on their own are too generic; together they

      // i.e. a page-load scan isn't starved by a co-scheduled observer scan.

      // never ran and the "Have AI fix this" banner never appeared. Keying on
      // any element mutation lets that detector run on the boundary swap.
      // scheduleScan() debounces to one scan per 200ms and scanAndSend() dedups
